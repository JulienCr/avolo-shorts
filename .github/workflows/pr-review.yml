name: Review IA des PR

# Un troisième relecteur, à côté de Copilot et de Codex. Il lit avec la doctrine
# du dépôt sous les yeux, ce qu'aucun des deux autres ne fait : les décisions de
# conception de ce projet sont adossées à des mesures et se défont par réflexe.
#
# Le code de la review vit dans JulienCr/gh-actions, pas ici : une correction de
# prompt faite là-bas arrive ici au run suivant, sans commit de ce côté.
#
# Le job ne bloque jamais : il sort en 0 quoi qu'il arrive. Mais deux cas d'échec
# ne se ressemblent pas, et les confondre coûte cher :
#
#   - quota épuisé, panne d'Ollama : l'action le dit dans un commentaire ;
#   - **secret absent : totalement silencieux**. L'action le journalise et ne
#     poste rien du tout.
#
# Donc tant que `OLLAMA_API_KEY` n'est pas posé, une PR sans commentaire n'a pas
# été jugée irréprochable : elle n'a pas été relue. Vérifier le secret avant de
# lire une absence de commentaire comme un feu vert.
#
# ⚠️ Il poste un **commentaire top-level**, pas une review. Ni `gh pr view
# --comments` ni la liste des fils de review ne le montrent au bon endroit : la
# skill check-reviews va le chercher dans le bloc `comments`.
#
# ⚠️ Il ne relit qu'à l'ouverture, pas à chaque push, contrairement à Copilot.
# Pour une deuxième passe après corrections, commenter « @aristarque review ».

on:
  pull_request:
    # `opened` est le cas nominal. `ready_for_review` rattrape les brouillons,
    # qu'on ne relit pas tant qu'ils ne sont pas prêts.
    types: [opened, ready_for_review]
  # Une mention rattrape ce que les deux autres ne couvrent pas : ni « opened »
  # ni « ready_for_review » ne se rejouent sur une PR déjà relue, et un rebase
  # ne redéclenche rien.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Numéro de la PR à relire'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  # Pour réagir 👀 au commentaire déclencheur. Un commentaire de conversation de
  # PR est un commentaire d'issue au sens de l'API : « pull-requests » ne suffit pas.
  issues: write

jobs:
  review:
    # Un brouillon ne consomme pas de quota : il sera relu au passage en « prêt ».
    # La mention passe outre le brouillon : demander explicitement une review
    # sur un brouillon est une demande, pas un accident.
    #
    # ⚠️ La garde sur l'auteur n'est pas du confort. `issue_comment` s'exécute avec
    # les secrets du dépôt et un jeton en écriture, sur commentaire de n'importe
    # qui. Ce dépôt est public : sans allowlist, un inconnu vide la clé Ollama en
    # boucle. `issue.pull_request` écarte au passage les commentaires d'issue,
    # que le même événement porte aussi.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
      || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.login == 'JulienCr'
          && contains(github.event.comment.body, '@aristarque review'))
    runs-on: ubuntu-latest
    # Au niveau du job, pas du workflow. Un run dont le job est écarté par la
    # garde ci-dessus n'entre jamais dans le groupe ; au niveau du workflow il y
    # entrait avant que la garde soit évaluée, donc n'importe quel commentaire
    # d'un inconnu annulait la review en cours via `cancel-in-progress`. La
    # garde sur l'auteur empêchait de lancer une review, pas d'en tuer une.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    # Trois passes en parallèle puis leur fusion : le mur vaut jusqu'à deux fois
    # le timeout interne de l'action, plus la marge du commentaire d'échec.
    timeout-minutes: 40
    steps:
      # Un run déclenché par commentaire n'apparaît pas comme check sur la PR :
      # sans cet accusé de réception, la mention se fait à l'aveugle.
      - name: Accuser réception de la mention
        if: github.event_name == 'issue_comment'
        # Cosmétique, donc non bloquant : sans ceci un `gh api` qui échoue (rate
        # limit, commentaire supprimé) sort en non-zéro, et checkout comme review
        # sont skippés. La réaction manquerait ET la review avec.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      # La tête de la PR, pas le commit de merge : le contenu lu doit
      # correspondre au diff, sinon le modèle raisonne sur des numéros de ligne
      # qui ont bougé.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number || inputs.pr) }}

      # `@main` et non un tag majeur : on veut la dernière version sans attendre
      # une migration à chaque majeur, les réglages de coût étant précisément ce
      # qu'on ne veut pas rater. Le prix est réel, un commit fautif là-bas
      # arrivant ici sans palier ; il est tenable parce que la CI de gh-actions
      # refuse un `dist/` en retard sur `src/`, donc `main` est toujours
      # construit, et parce que l'action ne fait jamais échouer le job. Repasser
      # sur un tag majeur le jour où on préfère un palier à la fraîcheur.
      - uses: JulienCr/gh-actions/pr-review@main
        with:
          pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          # L'interrupteur vit dans Settings → Variables, pas ici : couper la
          # review pour garder du quota ne doit pas demander un commit, ni
          # attendre qu'une branche reparte de `main`. La variable vaut pour
          # toutes les branches qui portent cette ligne, d'un coup.
          #
          # `false`, `0`, `no` ou `off` éteignent. ⚠️ Une variable SUPPRIMÉE rend
          # une chaîne vide, que l'action lit comme allumé : le sens de la panne
          # va vers la review qui tourne, jamais vers une PR qu'on croirait
          # relue. Pour éteindre, poser la valeur — ne pas retirer la variable.
          enable: ${{ vars.ENABLE_ARISTARQUE }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          # CLAUDE.md porte les sept décisions à ne pas défaire ; la spec porte
          # les mesures qui les fondent. Un relecteur qui n'a que la première
          # sait qu'une règle existe, pas pourquoi elle résiste.
          doctrine: |
            CLAUDE.md
            docs/superpowers/specs/2026-08-17-avolo-shorts-design.md
