# pnpm 11 refuse par défaut d'exécuter les scripts d'installation. Chaque paquet
# est tranché explicitement ici, sinon `pnpm install` signale un build ignoré à
# chaque passage — y compris en CI.
allowBuilds:
  # Module natif : sans son script d'installation, il n'y a pas de binaire.
  better-sqlite3: true
  # Scripts purement optionnels (télémétrie, génération de types déjà publiée).
  '@google/genai': false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  # Arrivé avec `tsx`, qui porte les scripts de développement (`scripts/dev-*.ts`).
  # `false` : le binaire d'esbuild est livré par le paquet de plateforme
  # `@esbuild/linux-x64`, que pnpm installe en dépendance optionnelle. Le script
  # `postinstall` ne fait que le recopier à côté du paquet principal, ce dont
  # `tsx` n'a pas besoin — vérifié en exécutant un script sans lui.
  esbuild: false
